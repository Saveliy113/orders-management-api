openapi: "3.0.3"
info:
  title: Orders Management API
  description: REST API for managing orders, built with Go (Fiber) and PostgreSQL.
  version: "1.0.0"
servers:
  - url: http://localhost:3000
    description: Local development server

paths:
  /alive:
    get:
      summary: Health check
      description: Returns the current health status of the API.
      responses:
        "200":
          description: API is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
              example:
                status: ok

  /orders:
    get:
      summary: List orders
      description: >
        Returns a paginated, optionally filtered list of orders.
        Results are sorted by created_at descending (newest first).
      parameters:
        - name: page
          in: query
          required: false
          description: Page number (1-indexed).
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 2

        - name: limit
          in: query
          required: false
          description: Number of orders per page. Clamped to [1, 100].
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 10

        - name: status
          in: query
          required: false
          description: Filter by order status.
          schema:
            type: string
            enum:
              - pending
              - completed
              - cancelled
          example: pending

        - name: date_from
          in: query
          required: false
          description: >
            Inclusive lower bound for created_at.
            Accepts YYYY-MM-DD or RFC 3339 (e.g. 2025-01-15T00:00:00Z).
          schema:
            type: string
            format: date
          example: "2025-01-01"

        - name: date_to
          in: query
          required: false
          description: >
            Inclusive upper bound for created_at.
            Accepts YYYY-MM-DD or RFC 3339.
          schema:
            type: string
            format: date
          example: "2025-01-31"

        - name: amount_min
          in: query
          required: false
          description: Inclusive lower bound for order total.
          schema:
            type: number
            format: double
          example: 50.00

        - name: amount_max
          in: query
          required: false
          description: Inclusive upper bound for order total.
          schema:
            type: number
            format: double
          example: 200.00

      responses:
        "200":
          description: Paginated list of orders.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"
              examples:
                default:
                  summary: Default request (no filters)
                  value:
                    orders:
                      - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                        customer_name: "Alice Johnson"
                        status: "pending"
                        total: 49.99
                        created_at: "2025-02-06T12:00:00Z"
                        updated_at: "2025-02-07T12:00:00Z"
                      - id: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
                        customer_name: "Bob Smith"
                        status: "completed"
                        total: 129.50
                        created_at: "2025-02-05T12:00:00Z"
                        updated_at: "2025-02-07T12:00:00Z"
                    total: 50
                    total_pages: 3
                filtered:
                  summary: Filtered by status=pending, page=1, limit=5
                  value:
                    orders:
                      - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                        customer_name: "Alice Johnson"
                        status: "pending"
                        total: 49.99
                        created_at: "2025-02-06T12:00:00Z"
                        updated_at: "2025-02-07T12:00:00Z"
                    total: 22
                    total_pages: 5
                empty_page:
                  summary: Page beyond available data
                  value:
                    orders: []
                    total: 50
                    total_pages: 3

        "400":
          description: Invalid query parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid_status:
                  summary: Invalid status value
                  value:
                    error: "invalid status parameter, must be one of: pending, completed, cancelled"
                invalid_page:
                  summary: Non-numeric page
                  value:
                    error: "invalid page parameter"
                invalid_date:
                  summary: Malformed date
                  value:
                    error: "invalid date_from parameter, expected format: YYYY-MM-DD or RFC 3339"
                invalid_amount:
                  summary: Non-numeric amount
                  value:
                    error: "invalid amount_min parameter"

        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "unexpected database error"

components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique order identifier.
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        customer_name:
          type: string
          description: Name of the customer.
          example: "Alice Johnson"
        status:
          type: string
          enum:
            - pending
            - completed
            - cancelled
          description: Current order status.
          example: "pending"
        total:
          type: number
          format: double
          description: Order amount.
          example: 49.99
        created_at:
          type: string
          format: date-time
          description: Timestamp when the order was created.
          example: "2025-02-06T12:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the order was last updated.
          example: "2025-02-07T12:00:00Z"

    OrderListResponse:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
          description: List of orders for the current page.
        total:
          type: integer
          description: Total number of orders matching the filters (computed via COUNT(*)).
          example: 50
        total_pages:
          type: integer
          description: Total number of pages (ceil of total / limit).
          example: 3

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message.
          example: "invalid status parameter, must be one of: pending, completed, cancelled"
